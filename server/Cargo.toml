[package]
name = "n3e-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"
[dependencies]
prost = "=0.13.5"
openssl = "=0.10.72"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-openssl = "=0.6.5"
postgres = "=0.19.10"
socket2 = "=0.6.5"
# Admin API JSON (specs/03-admin-api.md); already in the workspace lock via launcher/ and bot/.
serde_json = "=1.0.154"
[dev-dependencies]
# The admin route table is checked against the bot's contract copy.
realm-bot = { path = "../bot" }
# Paused time for the frame deadline tests (server/src/network.rs).
tokio = { version = "=1.53.1", features = ["test-util"] }
[build-dependencies]
prost-build = "=0.13.5"
