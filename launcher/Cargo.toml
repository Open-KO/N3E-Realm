[package]
name = "realm-launcher"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "N3E Realm launcher: keeps the client and content current, starts the game"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
