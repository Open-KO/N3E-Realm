[package]
name = "realm-bot"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "N3E Realm Discord bot: slash commands -> admin API; realm events -> Discord"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# Discord: gateway (interactions only, no intents), REST, models. rustls with bundled
# roots so the image and Windows need no system CA store; no zlib transport.
twilight-gateway = { version = "=0.16.0", default-features = false, features = ["rustls-ring", "rustls-webpki-roots", "twilight-http"] }
twilight-http = { version = "=0.16.0", default-features = false, features = ["rustls-ring", "rustls-webpki-roots"] }
twilight-model = "=0.16.0"
twilight-util = { version = "=0.16.0", features = ["builder"] }
redis = { version = "0.32", default-features = false, features = ["aio", "tokio-comp", "streams"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[dev-dependencies]
twilight-validate = "=0.16.0"
